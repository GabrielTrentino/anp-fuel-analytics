[project]
name = "anp-fuel-analytics"
version = "0.1.0"
description = "Análises exploratórias e pipelines dos dados abertos de combustíveis da ANP"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "run", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: testes que acessam o portal da ANP (rodam só no workflow agendado)"]
