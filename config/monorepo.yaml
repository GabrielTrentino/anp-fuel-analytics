# Configuração do monorepo anp-fuel-analytics. Caminhos relativos à raiz do repositório.
#
# Cada estudo declara:
#   download  — arquivos do portal (base + files). Estudos com regras próprias
#               (pmqc, serie-historica-precos, producao-por-poco) usam script Python.
#   pipeline  — etapas em ordem. engine: download | python | sql.
#               Etapas SQL declaram `outputs` (contrato: o run.py falha se faltar algum)
#               e `vars` extras usadas no .sql como {{NOME}}.
#   quality   — testes de qualidade rodados por `py pipelines/run.py <slug> check`.
#               Regras: min_rows, not_null, unique, no_duplicate_rows, accepted_values, range.
#               `severity: warn` marca anomalia conhecida da fonte (não falha o pipeline).

repo:
  name: anp-fuel-analytics
  atlas_repo: anp-data-atlas
layers:
- raw
- trusted
- refined
paths:
  data: data
  pipelines: pipelines
  sql: pipelines/sql
  python: pipelines/python
studies:
  tancagem-abastecimento:
    slug: tancagem-abastecimento
    title: Tancagem do Abastecimento Nacional de Combustíveis
    atlas_doc: docs/conjuntos/tancagem-abastecimento.md
    notebooks: estudos/tancagem-abastecimento/notebooks
    trusted_uf_split:
    - GO
    - TO
    - DF
    paths:
      raw: data/raw/tancagem-abastecimento
      trusted: data/trusted/tancagem-abastecimento
      trusted_uf: data/trusted/tancagem-abastecimento/uf
      refined: data/refined/tancagem-abastecimento
    pipeline:
    - step: raw
      engine: download
    - step: raw_prepare
      engine: python
      script: pipelines/python/prepare_tancagem_raw.py
    - step: trusted
      engine: sql
      script: pipelines/sql/tancagem-abastecimento/trusted.sql
      outputs:
      - data/trusted/tancagem-abastecimento/tancagem.parquet
    - step: trusted_uf
      engine: sql
      script: pipelines/sql/tancagem-abastecimento/split_trusted_ufs.sql
      vars:
        TRUSTED_PARQUET: data/trusted/tancagem-abastecimento/tancagem.parquet
      outputs:
      - data/trusted/tancagem-abastecimento/uf/GO.parquet
      - data/trusted/tancagem-abastecimento/uf/TO.parquet
      - data/trusted/tancagem-abastecimento/uf/DF.parquet
    - step: refined
      engine: sql
      script: pipelines/sql/tancagem-abastecimento/refined.sql
      vars:
        TRUSTED_PARQUET: data/trusted/tancagem-abastecimento/tancagem.parquet
        REFINED_PARQUET: data/refined/tancagem-abastecimento/tancagem_por_mes_uf_grupo_tag.parquet
      outputs:
      - data/refined/tancagem-abastecimento/tancagem_por_mes_uf_grupo_tag.parquet
    download:
      base: https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/arquivos-tancagem-do-abastecimento-nacional-de-combustiveis
      timeout: 120
      files:
      - metadados-tancagem.pdf
      - src: dados-abertos/2026/janeiro.csv
        dest: 2026/janeiro.csv
      - src: dados-abertos/2026/fevereiro.csv
        dest: 2026/fevereiro.csv
      - src: dados-abertos/2026/marco.csv
        dest: 2026/marco.csv
      - src: dados-abertos/2026/abril.csv
        dest: 2026/abril.csv
      - src: dados-abertos/2025/janeiro.csv
        dest: 2025/janeiro.csv
      - src: dados-abertos/2025/fevereiro.csv
        dest: 2025/fevereiro.csv
      - src: dados-abertos/2025/marco.csv
        dest: 2025/marco.csv
      - src: dados-abertos/2025/maio-junho.csv
        dest: 2025/maio-junho.csv
      - src: dados-abertos/2025/julho-agosto.csv
        dest: 2025/julho-agosto.csv
      - src: dados-abertos/2025/setembro-a-novembro.csv
        dest: 2025/setembro-a-novembro.csv
      - src: dados-abertos/2025/dezembro.csv
        dest: 2025/dezembro.csv
      - src: dados-abertos/2024/janeiro.csv
        dest: 2024/janeiro.csv
      - src: dados-abertos/2024/fevereiro.csv
        dest: 2024/fevereiro.csv
      - src: dados-abertos/2024/marco-julho.csv
        dest: 2024/marco-julho.csv
      - src: dados-abertos/2024/agosto.csv
        dest: 2024/agosto.csv
      - src: dados-abertos/2024/setembro-outubro.csv
        dest: 2024/setembro-outubro.csv
      - src: dados-abertos/2024/novembro.csv
        dest: 2024/novembro.csv
      - src: dados-abertos/2024/dezembro.csv
        dest: 2024/dezembro.csv
      - src: dados-abertos/2023/janeiro.csv
        dest: 2023/janeiro.csv
      - src: dados-abertos/2023/fevereiro.csv
        dest: 2023/fevereiro.csv
      - src: dados-abertos/2023/marco.csv
        dest: 2023/marco.csv
      - src: dados-abertos/2023/abril.csv
        dest: 2023/abril.csv
      - src: dados-abertos/2023/maio.csv
        dest: 2023/maio.csv
      - src: dados-abertos/2023/junho.csv
        dest: 2023/junho.csv
      - src: dados-abertos/2023/agosto.csv
        dest: 2023/agosto.csv
      - src: dados-abertos/2023/setembro.csv
        dest: 2023/setembro.csv
      - src: dados-abertos/2023/outubro.csv
        dest: 2023/outubro.csv
      - src: dados-abertos/2023/novembro.csv
        dest: 2023/novembro.csv
      - src: dados-abertos/2023/dezembro.csv
        dest: 2023/dezembro.csv
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_junho_2022.csv
        dest: 2022/tancagem_terminais_dados_abertos_junho_2022.csv
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_julho_2022.csv
        dest: 2022/tancagem_terminais_dados_abertos_julho_2022.csv
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_v1.csv
        dest: 2022/tancagem_terminais_dados_abertos_v1.csv
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_2022_09_01.csv
        dest: 2022/tancagem_terminais_dados_abertos_2022_09_01.csv
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_outubro_2022-csv.xlsx
        dest: 2022/tancagem_terminais_dados_abertos_outubro_2022-csv.xlsx
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_novembro_2022.csv
        dest: 2022/tancagem_terminais_dados_abertos_novembro_2022.csv
      - src: dados-abertos/2022/tancagem_terminais_dados_abertos_dezembro_2022.csv
        dest: 2022/tancagem_terminais_dados_abertos_dezembro_2022.csv
    quality:
    - table: data/trusted/tancagem-abastecimento/tancagem.parquet
      min_rows: 100000
      not_null:
      - Data
      - CodInstalacao
      - GrupoDeProdutos
      - TancagemM3
      unique:
        columns:
        - Data
        - CodInstalacao
        - Tag
        - GrupoDeProdutos
        severity: warn
        note: arquivos de 2023-2024 com periodos sobrepostos repetem a mesma Data (41 mil linhas)
      accepted_values:
        Uf: &id001
        - AC
        - AL
        - AM
        - AP
        - BA
        - CE
        - DF
        - ES
        - GO
        - MA
        - MG
        - MS
        - MT
        - PA
        - PB
        - PE
        - PI
        - PR
        - RJ
        - RN
        - RO
        - RR
        - RS
        - SC
        - SE
        - SP
        - TO
