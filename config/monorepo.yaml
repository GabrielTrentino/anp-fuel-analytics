  pmqc:
    slug: pmqc
    title: Programa de Monitoramento da Qualidade dos Combustíveis
    atlas_doc: docs/conjuntos/pmqc.md
    notebooks: estudos/pmqc/notebooks
    paths:
      raw: data/raw/pmqc
      trusted: data/trusted/pmqc
      refined: data/refined/pmqc
    pipeline:
    - step: raw
      engine: python
      script: pipelines/python/download_pmqc.py
      args:
      - --years
      - '2016'
      - '2017'
      - '2018'
      - '2019'
      - '2020'
      - '2021'
      - '2022'
      - '2023'
      - '2024'
      - '2025'
      - '2026'
    - step: trusted
      engine: sql
      script: pipelines/sql/pmqc/trusted.sql
      outputs:
      - data/trusted/pmqc/pmqc.parquet
    - step: refined_nao_conformidade
      engine: sql
      script: pipelines/sql/pmqc/refined_nao_conformidade.sql
      vars:
        TRUSTED_PARQUET: data/trusted/pmqc/pmqc.parquet
      outputs:
      - data/refined/pmqc/nao_conformidade_uf_produto.parquet
    - step: refined_precos
      engine: sql
      script: pipelines/sql/pmqc/refined_pmqc_precos.sql
      vars:
        TRUSTED_PARQUET: data/trusted/pmqc/pmqc.parquet
        TRUSTED_LPC: data/trusted/serie-historica-precos/lpc_posto.parquet
      outputs:
      - data/refined/pmqc/pmqc_precos_join.parquet
      - data/refined/pmqc/resumo_preco_conformidade.parquet
    quality:
    - table: data/trusted/pmqc/pmqc.parquet
      min_rows: 1000000
      not_null:
      - data_coleta
      - id_numeric
      - ensaio
      - conforme
      no_duplicate_rows: true
      unique:
        columns:
        - id_numeric
        - ensaio
        severity: warn
        note: ~10 mil ensaios com atributos divergentes (distribuidora, resultado) na fonte
      accepted_values:
        uf: *id001
  cadastro-revendas-glp:
    slug: cadastro-revendas-glp
