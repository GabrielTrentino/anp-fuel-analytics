      min_rows: 1000
      unique:
      - data_referencia
      - uf
      - produto
      - segmento
    - table: data/trusted/vendas-derivados/vendas_diesel_tipo.parquet
      min_rows: 1000
      unique:
      - data_referencia
      - uf
      - produto
