name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (config, SQL com fixtures, download, qualidade)
        run: pytest -q
      - name: Notebooks sem saídas gigantes (< 2 MB cada)
        shell: bash
        run: |
          big=$(find estudos -name '*.ipynb' -size +2M)
          if [ -n "$big" ]; then echo "Notebooks acima de 2 MB:"; echo "$big"; exit 1; fi
