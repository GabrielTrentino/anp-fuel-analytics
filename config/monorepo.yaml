      script: pipelines/python/download_serie_historica_precos.py
    - step: trusted_qus_gasolina
      engine: sql
      script: pipelines/sql/serie-historica-precos/trusted_qus_gasolina.sql
      outputs:
      - data/trusted/serie-historica-precos/qus_gasolina_etanol.parquet
    - step: trusted_dsan_gasolina
      engine: sql
      script: pipelines/sql/serie-historica-precos/trusted_dsan_gasolina_etanol.sql
      outputs:
      - data/trusted/serie-historica-precos/dsan_gasolina_etanol_2024_2025.parquet
    - step: trusted_lpc_posto
      engine: sql
      script: pipelines/sql/serie-historica-precos/trusted_lpc_posto.sql
      outputs:
      - data/trusted/serie-historica-precos/lpc_posto.parquet
    - step: trusted_dsan_diesel_gnv
      engine: sql
      script: pipelines/sql/serie-historica-precos/trusted_dsan_diesel_gnv.sql
      outputs:
      - data/trusted/serie-historica-precos/dsan_diesel_gnv_2024_2025.parquet
    quality:
    - table: data/trusted/serie-historica-precos/lpc_posto.parquet
      min_rows: 100000
      not_null:
      - cnpj
      - produto
      - data_coleta
      - valor_venda
      unique:
        columns:
        - cnpj
        - produto
        - data_coleta
        severity: warn
        note: poucas coletas repetidas na fonte
      accepted_values:
        uf: *id001
      range:
        valor_venda:
          min: 0
          max: 250
    - table: data/trusted/serie-historica-precos/dsan_gasolina_etanol_2024_2025.parquet
      min_rows: 100000
      not_null:
      - cnpj
      - produto
      - data_coleta
      unique:
        columns:
        - cnpj
        - produto
        - data_coleta
        severity: warn
    - table: data/trusted/serie-historica-precos/dsan_diesel_gnv_2024_2025.parquet
      min_rows: 100000
      not_null:
      - cnpj
      - produto
      - data_coleta
      unique:
        columns:
        - cnpj
        - produto
        - data_coleta
        severity: warn
    - table: data/trusted/serie-historica-precos/qus_gasolina_etanol.parquet
      min_rows: 1000
      unique:
      - cnpj
      - produto
      - data_coleta
