# Configuração compartilhada do monorepo anp-fuel-analytics.
# Caminhos são relativos à raiz do repositório.

repo:
  name: anp-fuel-analytics
  atlas_repo: anp-data-atlas  # referência documental (GitHub / path local)

layers:
  - raw       # Python — download e preparação
  - trusted   # SQL — consolidação
  - refined   # SQL — agregações analíticas

paths:
  data: data
  pipelines: pipelines
  sql: pipelines/sql
  python: pipelines/python

studies:
  tancagem-abastecimento:
    slug: tancagem-abastecimento
    title: Tancagem do Abastecimento Nacional de Combustíveis
    atlas_doc: docs/conjuntos/tancagem-abastecimento.md  # no repositório anp-data-atlas
    notebooks: estudos/tancagem-abastecimento/notebooks
    trusted_uf_split: [GO, TO, DF]
    paths:
      raw: data/raw/tancagem-abastecimento
      trusted: data/trusted/tancagem-abastecimento
      trusted_uf: data/trusted/tancagem-abastecimento/uf
      refined: data/refined/tancagem-abastecimento
    pipeline:
      - step: raw
        engine: python
        script: pipelines/python/download_tancagem.py
      - step: raw_prepare
        engine: python
        script: pipelines/python/prepare_tancagem_raw.py
      - step: trusted
        engine: sql
        script: pipelines/sql/tancagem-abastecimento/trusted.sql
        output: data/trusted/tancagem-abastecimento/tancagem.parquet
      - step: trusted_uf
        engine: sql
        script: pipelines/sql/tancagem-abastecimento/split_trusted_ufs.sql
      - step: refined
        engine: sql
        script: pipelines/sql/tancagem-abastecimento/refined.sql
        output: data/refined/tancagem-abastecimento/tancagem_por_mes_uf_grupo_tag.parquet
  movimentacao-derivados:
    slug: movimentacao-derivados
    title: Movimentação de derivados de petróleo, gás natural e biocombustíveis
    atlas_doc: docs/conjuntos/movimentacao-derivados.md
    notebooks: estudos/movimentacao-derivados/notebooks
    products:
      - liquidos
      - glp
      - lubrificante
      - trr
      - aviacao
      - asfalto
      - solvente
      - fornecedores-vendas-diretas
      - movimentacaologistica
    paths:
      raw: data/raw/movimentacao-derivados
      trusted: data/trusted/movimentacao-derivados
      refined: data/refined/movimentacao-derivados
    pipeline:
      - step: raw
        engine: python
        script: pipelines/python/download_movimentacao_derivados.py
      - step: raw_prepare
        engine: python
        script: pipelines/python/prepare_movimentacao_raw.py
      - step: trusted_liquidos
        engine: sql
        script: pipelines/sql/movimentacao-derivados/trusted_liquidos_vendas.sql
        output: data/trusted/movimentacao-derivados/liquidos_vendas_atual.parquet
  cadastro-revendas-combustiveis:
    slug: cadastro-revendas-combustiveis
    title: Dados Cadastrais dos Revendedores Varejistas de Combustíveis Automotivos
    atlas_doc: docs/conjuntos/cadastro-revendas-combustiveis.md
    notebooks: estudos/cadastro-revendas-combustiveis/notebooks
    paths:
      raw: data/raw/cadastro-revendas-combustiveis
      trusted: data/trusted/cadastro-revendas-combustiveis
      refined: data/refined/cadastro-revendas-combustiveis
    pipeline:
      - step: raw
        engine: python
        script: pipelines/python/download_cadastro_revendas_combustiveis.py
      - step: trusted
        engine: sql
        script: pipelines/sql/cadastro-revendas-combustiveis/trusted.sql
        output: data/trusted/cadastro-revendas-combustiveis/revendas.parquet
  serie-historica-precos:
    slug: serie-historica-precos
    title: Série Histórica de Preços de Combustíveis
    atlas_doc: docs/conjuntos/serie-historica-precos.md
    notebooks: estudos/serie-historica-precos/notebooks
    paths:
      raw: data/raw/serie-historica-precos
      trusted: data/trusted/serie-historica-precos
      refined: data/refined/serie-historica-precos
    pipeline:
      - step: raw
        engine: python
        script: pipelines/python/download_serie_historica_precos.py
      - step: trusted_qus_gasolina
        engine: sql
        script: pipelines/sql/serie-historica-precos/trusted_qus_gasolina.sql
        output: data/trusted/serie-historica-precos/qus_gasolina_etanol.parquet
      - step: trusted_dsan_gasolina
        engine: sql
        script: pipelines/sql/serie-historica-precos/trusted_dsan_gasolina_etanol.sql
        output: data/trusted/serie-historica-precos/dsan_gasolina_etanol_2024_2025.parquet
      - step: trusted_lpc_posto
        engine: sql
        script: pipelines/sql/serie-historica-precos/trusted_lpc_posto.sql
        output: data/trusted/serie-historica-precos/lpc_posto.parquet
  vendas-derivados:
    slug: vendas-derivados
    title: Vendas de derivados de petróleo e biocombustíveis
    atlas_doc: docs/conjuntos/vendas-derivados.md
    notebooks: estudos/vendas-derivados/notebooks
    paths:
      raw: data/raw/vendas-derivados
      trusted: data/trusted/vendas-derivados
      refined: data/refined/vendas-derivados
    pipeline:
      - step: raw
        engine: python
        script: pipelines/python/download_vendas_derivados.py
      - step: raw_prepare
        engine: python
        script: pipelines/python/prepare_vendas_derivados_raw.py
      - step: trusted_mensal
        engine: sql
        script: pipelines/sql/vendas-derivados/trusted_mensal.sql
        output: data/trusted/vendas-derivados/vendas_mensal.parquet
      - step: trusted_segmento
        engine: sql
        script: pipelines/sql/vendas-derivados/trusted_segmento.sql
        output: data/trusted/vendas-derivados/vendas_segmento.parquet
  pmqc:
    slug: pmqc
    title: Programa de Monitoramento da Qualidade dos Combustíveis
    atlas_doc: docs/conjuntos/pmqc.md
    notebooks: estudos/pmqc/notebooks
    paths:
      raw: data/raw/pmqc
      trusted: data/trusted/pmqc
      refined: data/refined/pmqc
    pipeline:
      - step: raw
        engine: python
        script: pipelines/python/download_pmqc.py
      - step: trusted
        engine: sql
        script: pipelines/sql/pmqc/trusted.sql
        output: data/trusted/pmqc/pmqc.parquet
